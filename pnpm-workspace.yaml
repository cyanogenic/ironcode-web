packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall only selects legacy TypeScript for Node 10/12; runtime uses bundled dist.
  '@alicloud/openapi-core': false
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
