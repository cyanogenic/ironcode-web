name: ironcode-production

services:
  app:
    image: ${IRONCODE_IMAGE:-ghcr.io/cyanogenic/ironcode-web:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://ironcode:${POSTGRES_PASSWORD}@postgres:5432/ironcode?schema=public
      APP_ORIGINS: ${APP_ORIGINS:?Set APP_ORIGINS in .env}
      CUSTOMER_HOST: ${CUSTOMER_HOST:?Set CUSTOMER_HOST in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ironcode
      POSTGRES_USER: ironcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ironcode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironcode -d ironcode"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ironcode-postgres:
