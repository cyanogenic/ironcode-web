name: ironcode-development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ironcode
      POSTGRES_USER: ironcode
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ironcode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironcode -d ironcode"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ironcode-postgres:
